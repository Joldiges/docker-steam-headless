[program:seatd]
priority=10
autostart=true
autorestart=true
user=root
command=/usr/sbin/seatd -g video -l error
stopsignal=TERM
stdout_logfile=/var/log/supervisor/seatd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
stderr_logfile=/var/log/supervisor/seatd.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=7
