[program:bolt-install]
priority=40
autostart=true
autorestart=false
user=root
command=/usr/bin/install-bolt.sh
stdout_logfile=/var/log/bolt-install-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/bolt-install-supervisor.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
