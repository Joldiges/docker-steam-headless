[program:wayvnc]
priority=60
autostart=false
autorestart=true
user=%(ENV_USER)s
directory=/home/%(ENV_USER)s
command=/usr/bin/start-wayvnc.sh
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",WAYLAND_DISPLAY="wayland-0"
stopsignal=INT
stdout_logfile=/home/%(ENV_USER)s/.cache/log/wayvnc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/%(ENV_USER)s/.cache/log/wayvnc.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
