[program:steam]
priority=50
autostart=false
autorestart=false
startretries=50
user=%(ENV_USER)s
directory=/home/%(ENV_USER)s
command=/usr/bin/start-steam-labwc.sh
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",WAYLAND_DISPLAY="wayland-0",XDG_CURRENT_DESKTOP="labwc",XDG_SESSION_TYPE="wayland",WLR_BACKENDS="headless,libinput"
stopsignal=INT
stdout_logfile=/home/%(ENV_USER)s/.cache/log/steam.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
stderr_logfile=/home/%(ENV_USER)s/.cache/log/steam.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=7
